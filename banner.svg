<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Felipe Toledano Escudero, Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.85" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glowA)"/>
    <rect width="1200" height="300" fill="url(#glowB)"/>

    <text x="1010" y="205" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="170" font-weight="700" fill="#ffffff" fill-opacity="0.07">&lt;/&gt;</text>

    <text x="80" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="5" fill="#22d3ee">FULL STACK DEVELOPER</text>
    <text x="78" y="182" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="700" fill="#f8fafc">Felipe Toledano</text>
    <rect x="80" y="206" width="96" height="4" rx="2" fill="url(#accent)"/>
    <text x="80" y="248" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#94a3b8">React · TypeScript · NestJS — Granada, España</text>
  </g>
</svg>
