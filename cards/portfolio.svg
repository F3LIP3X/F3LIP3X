<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 250" width="580" height="250" role="img" aria-label="Portfolio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <clipPath id="round"><rect width="580" height="250" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="580" height="250" fill="url(#bg)"/>
    <rect width="580" height="250" fill="url(#grid)"/>
    <rect width="580" height="250" fill="url(#glow)"/>
    <text x="480" y="146" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="84" font-weight="700" fill="#818cf8" fill-opacity="0.5">&lt;/&gt;</text>
    <text x="36" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#818cf8">PORTFOLIO</text>
    <text x="35" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#f8fafc">Portfolio</text>
    <text x="36" y="138" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Mi web personal, con el resto de proyectos</text>
    <text x="36" y="162" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">y mi trayectoria.</text>
    <rect x="0" y="246" width="580" height="4" fill="#818cf8" fill-opacity="0.7"/>
  </g>
</svg>
